<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>大食いチャレンジ — Gorge &amp; Belch</title>
<style>
  :root{
    --bg0:#0d0b10; --bg1:#171319; --line:#2c252f;
    --ink:#f2e9e4; --dim:#9d8f96;
    --full:#f0a24b; --gas:#63d0b4; --bad:#e8556d; --good:#8fd14f;
    --font: "Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(120% 90% at 50% 0%, #1d1720 0%, var(--bg0) 70%);
    color:var(--ink); font-family:var(--font); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  #app{
    position:relative; width:min(100vw, calc(100vh * 0.62)); height:100vh;
    max-width:620px; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#15111a,#0c0a0e);
    box-shadow:0 0 80px #000 inset;
  }
  canvas{ width:100%; flex:1 1 auto; display:block; min-height:0; touch-action:none; }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:0; left:0; right:0; padding:10px 12px 22px; pointer-events:none; z-index:5;
    background:linear-gradient(180deg,#0a0810e0 0%,#0a081099 55%,transparent 100%);
  }
  .row{ display:flex; gap:10px; align-items:center }
  .stat{ flex:1 1 0; min-width:0 }
  .lbl{ display:flex; justify-content:space-between; gap:4px; font-size:clamp(9px,2.6vw,11px);
        letter-spacing:.04em; color:var(--dim); margin-bottom:3px; white-space:nowrap }
  .lbl b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums }
  .bar{ height:9px; border-radius:99px; background:#241e28; overflow:hidden; box-shadow:0 1px 0 #0006 inset }
  .bar i{ display:block; height:100%; width:0%; border-radius:99px; transition:width .12s linear }
  #fullBar i{ background:linear-gradient(90deg,#f5c06a,var(--full)) }
  #gasBar  i{ background:linear-gradient(90deg,#8ee8d0,var(--gas)) }
  .bar.danger i{ animation:flash .4s infinite alternate }
  @keyframes flash{ from{filter:none} to{filter:brightness(2) saturate(1.6)} }

  #top2{ margin-top:8px; justify-content:space-between; font-size:clamp(8px,2.4vw,11px);
         color:var(--dim); white-space:nowrap; gap:6px }
  #top2 span b{ color:var(--ink); font-size:clamp(12px,3.4vw,15px); font-variant-numeric:tabular-nums }
  #combo{
    position:absolute; right:12px; top:78px; font-size:clamp(10px,2.8vw,12px); letter-spacing:.06em;
    color:var(--full); font-weight:700; opacity:0; transition:opacity .2s;
    text-shadow:0 2px 10px #000;
  }
  #combo.on{ opacity:1 }

  /* ---------- controls ---------- */
  #ctl{ position:relative; z-index:5; padding:8px 10px 12px; background:linear-gradient(180deg,#00000000,#000000cc 30%); }
  #foods{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:8px }
  .food{
    pointer-events:auto; border:1px solid var(--line); background:#1a1620; color:var(--ink);
    border-radius:12px; padding:6px 2px 5px; font-family:var(--font); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.1;
    transition:transform .08s, background .12s, border-color .12s;
  }
  .food .em{ font-size:22px }
  .food .nm{ font-size:10px; color:var(--dim) }
  .food .st{ font-size:9px; color:#6c5f68; font-variant-numeric:tabular-nums }
  .food:active{ transform:scale(.93) }
  .food:disabled{ opacity:.35; cursor:default }
  .food.fizz{ border-color:#2e5a53 } .food.fizz .st{ color:var(--gas) }

  #burp{
    pointer-events:auto; width:100%; border:none; border-radius:14px; padding:14px;
    font-family:var(--font); font-size:17px; font-weight:800; letter-spacing:.12em; cursor:pointer;
    color:#10240f; background:linear-gradient(180deg,#b8f078,#7fc23f); box-shadow:0 4px 0 #4c7d20;
    transition:transform .06s, box-shadow .06s, filter .2s;
  }
  #burp:active{ transform:translateY(4px); box-shadow:0 0 0 #4c7d20 }
  #burp.charged{ animation:pulse .7s infinite alternate }
  @keyframes pulse{ from{filter:brightness(1)} to{filter:brightness(1.35)} }
  #burp small{ display:block; font-size:10px; font-weight:500; letter-spacing:.05em; opacity:.7 }

  /* ---------- overlays ---------- */
  .ov{
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center; padding:28px;
    background:#0a0810e8; backdrop-filter:blur(4px);
  }
  .ov.hide{ display:none }
  .ov h1{ margin:0; font-size:34px; letter-spacing:.06em; line-height:1.2 }
  .ov h1 small{ display:block; font-size:12px; letter-spacing:.34em; color:var(--full); margin-top:8px; font-weight:400 }
  .ov p{ margin:0; font-size:13px; line-height:1.9; color:var(--dim);
         max-width:min(360px,100%); line-break:strict; overflow-wrap:normal }
  .ov p b{ color:var(--ink) }
  .ov .big{ font-size:44px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--full); margin:-6px 0 }
  .btn{
    border:none; border-radius:99px; padding:13px 34px; font-family:var(--font);
    font-size:15px; font-weight:700; letter-spacing:.1em; cursor:pointer;
    color:#1a1206; background:linear-gradient(180deg,#ffd79a,var(--full)); box-shadow:0 4px 0 #a35f1c;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #a35f1c }
  .keys{ font-size:11px; color:#6c5f68; letter-spacing:.05em }
  #toast{
    position:absolute; z-index:15; left:0; right:0; top:38%; text-align:center;
    font-size:30px; font-weight:800; letter-spacing:.08em; pointer-events:none;
    opacity:0; transform:scale(.8); text-shadow:0 3px 18px #000;
  }
  #toast.show{ animation:pop 1.1s ease-out forwards }
  @keyframes pop{
    0%{opacity:0;transform:scale(.7)} 15%{opacity:1;transform:scale(1.08)}
    30%{transform:scale(1)} 75%{opacity:1} 100%{opacity:0;transform:scale(1) translateY(-24px)}
  }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="row">
      <div class="stat">
        <div class="lbl"><span>満腹度</span><b><i id="fullN">0</i>%</b></div>
        <div class="bar" id="fullBar"><i></i></div>
      </div>
      <div class="stat">
        <div class="lbl"><span>ガス圧</span><b><i id="gasN">0</i>%</b></div>
        <div class="bar" id="gasBar"><i></i></div>
      </div>
    </div>
    <div class="row" id="top2">
      <span>STAGE <b id="stageN">1</b></span>
      <span>TIME <b id="timeN">70</b></span>
      <span>SCORE <b id="scoreN">0</b> / <i id="targetN">5000</i></span>
    </div>
    <div id="combo">×<b id="comboN">1</b> COMBO</div>
  </div>

  <canvas id="cv"></canvas>

  <div id="toast"></div>

  <div id="ctl">
    <div id="foods"></div>
    <button id="burp">ゲップ<small>SPACE — ガスを抜いて楽になる</small></button>
  </div>

  <!-- title -->
  <div class="ov" id="ovTitle">
    <h1>大食いチャレンジ<small>GORGE &amp; BELCH</small></h1>
    <p>食べて<b>満腹度</b>を稼ぐ。<br>
       たまった<b>ガス圧</b>は<b>ゲップ</b>で逃がす。<br>
       どちらかが 100% でギブアップ。<br>
       お腹を<b>なでる</b>と消化が進む。</p>
    <button class="btn" id="btnStart">はじめる</button>
    <div class="keys">1〜8 食べる ／ SPACE ゲップ ／ ドラッグ なでる</div>
  </div>

  <!-- stage clear -->
  <div class="ov hide" id="ovClear">
    <h1 id="clearTtl">STAGE CLEAR</h1>
    <div class="big" id="clearScore">0</div>
    <p id="clearMsg"></p>
    <button class="btn" id="btnNext">次のステージへ</button>
  </div>

  <!-- game over -->
  <div class="ov hide" id="ovOver">
    <h1 id="overTtl">ギブアップ…</h1>
    <p id="overWhy"></p>
    <div class="big" id="overScore">0</div>
    <p>ベストスコア <b id="overBest">0</b></p>
    <button class="btn" id="btnRetry">もう一度</button>
  </div>

</div>

<script>
"use strict";
/* =====================================================================
   大食いチャレンジ / Gorge & Belch
   単一ファイルの Canvas ゲーム。首から下のソフトボディを手描きレンダリング。
   ===================================================================== */

const W = 760, H = 940, CX = W / 2;          // 論理解像度
const cv = document.getElementById('cv');
const g  = cv.getContext('2d');
let DPR = 1;

function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width  = Math.round(r.width  * DPR);
  cv.height = Math.round(r.height * DPR);
}
addEventListener('resize', resize);

/* ---------- utils ---------- */
const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const rnd   = (a,b)=> a+Math.random()*(b-a);
const ease  = t=> t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* Catmull-Rom を三次ベジェで滑らかに繋ぐ */
function smoothPath(ctx, p){
  ctx.moveTo(p[0].x, p[0].y);
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p2;
    ctx.bezierCurveTo(
      p1.x+(p2.x-p0.x)/6, p1.y+(p2.y-p0.y)/6,
      p2.x-(p3.x-p1.x)/6, p2.y-(p3.y-p1.y)/6,
      p2.x, p2.y);
  }
}

/* =====================================================================
   AUDIO — すべて WebAudio で合成（外部素材なし）
   ===================================================================== */
const Sound = (()=>{
  let ac = null, master = null;
  function init(){
    if(ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
  }
  function noiseBuf(dur){
    const n = Math.max(1, Math.floor(ac.sampleRate*dur));
    const b = ac.createBuffer(1, n, ac.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
    return b;
  }
  /* ゲップ: ノイズ → 低域フィルタ、低周波の鋸波で振幅をばたつかせて「ぶるる」感を出す */
  function burp(power){            // power 0..1
    init(); const t = ac.currentTime;
    const dur = .30 + power*1.05;
    const src = ac.createBufferSource(); src.buffer = noiseBuf(dur+.1);

    const lp = ac.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(760 - power*180, t);
    lp.frequency.exponentialRampToValueAtTime(200 + power*120, t+dur);
    lp.Q.value = 6 + power*8;

    const bp = ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.setValueAtTime(300 - power*120, t); bp.Q.value = 1.4;

    /* 振幅をゆらす LFO（喉の震え） */
    const flutter = ac.createOscillator(); flutter.type='sawtooth';
    flutter.frequency.setValueAtTime(58 - power*26, t);
    flutter.frequency.linearRampToValueAtTime(26 - power*8, t+dur);
    const fg = ac.createGain(); fg.gain.value = .55;
    const mod = ac.createGain(); mod.gain.value = .45;    // 中心値
    flutter.connect(fg).connect(mod.gain);

    const env = ac.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(.85+power*.5, t+.035);
    env.gain.exponentialRampToValueAtTime(.35, t+dur*.55);
    env.gain.exponentialRampToValueAtTime(.0012, t+dur);

    const sh = ac.createWaveShaper();
    const c = new Float32Array(256);
    for(let i=0;i<256;i++){ const x=i/255*2-1; c[i]=Math.tanh(x*(2+power*3)); }
    sh.curve = c;

    src.connect(lp).connect(bp).connect(mod).connect(sh).connect(env).connect(master);

    /* 体の重み（サブベース） */
    const sub = ac.createOscillator(); sub.type='sine';
    sub.frequency.setValueAtTime(86-power*26, t);
    sub.frequency.exponentialRampToValueAtTime(48, t+dur*.8);
    const sg = ac.createGain();
    sg.gain.setValueAtTime(0, t);
    sg.gain.linearRampToValueAtTime(.16+power*.2, t+.05);
    sg.gain.exponentialRampToValueAtTime(.001, t+dur*.9);
    sub.connect(sg).connect(master);

    src.start(t); flutter.start(t); sub.start(t);
    src.stop(t+dur+.1); flutter.stop(t+dur+.1); sub.stop(t+dur+.1);
  }
  function gulp(){
    init(); const t = ac.currentTime;
    const o = ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(430, t);
    o.frequency.exponentialRampToValueAtTime(96, t+.16);
    const gg = ac.createGain();
    gg.gain.setValueAtTime(.0001, t);
    gg.gain.linearRampToValueAtTime(.30, t+.02);
    gg.gain.exponentialRampToValueAtTime(.0001, t+.19);
    o.connect(gg).connect(master); o.start(t); o.stop(t+.22);
  }
  function chew(){
    init(); const t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf(.09);
    const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value = rnd(700,1500); f.Q.value=2;
    const gg = ac.createGain();
    gg.gain.setValueAtTime(.18, t); gg.gain.exponentialRampToValueAtTime(.0005, t+.09);
    s.connect(f).connect(gg).connect(master); s.start(t); s.stop(t+.1);
  }
  /* 腹鳴り */
  function growl(){
    init(); const t = ac.currentTime; const dur = rnd(.5,1.0);
    const s = ac.createBufferSource(); s.buffer = noiseBuf(dur);
    const f = ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=14;
    f.frequency.setValueAtTime(rnd(90,150), t);
    f.frequency.linearRampToValueAtTime(rnd(60,110), t+dur);
    const gg = ac.createGain();
    gg.gain.setValueAtTime(.0001,t); gg.gain.linearRampToValueAtTime(.22,t+.12);
    gg.gain.exponentialRampToValueAtTime(.0002,t+dur);
    s.connect(f).connect(gg).connect(master); s.start(t); s.stop(t+dur);
  }
  function blip(freq, dur, vol){
    init(); const t = ac.currentTime;
    const o = ac.createOscillator(); o.type='triangle'; o.frequency.value = freq;
    const gg = ac.createGain();
    gg.gain.setValueAtTime(.0001,t); gg.gain.linearRampToValueAtTime(vol,t+.01);
    gg.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(gg).connect(master); o.start(t); o.stop(t+dur+.02);
  }
  return { init, burp, gulp, chew, growl, blip,
           resume(){ if(ac && ac.state==='suspended') ac.resume(); } };
})();

/* =====================================================================
   DATA
   ===================================================================== */
const FOODS = [
  { em:'🍙', nm:'おにぎり',   vol: 4.5, gas: 1,  pts:  70, chew:.42 },
  { em:'🍔', nm:'バーガー',   vol: 8.5, gas: 3,  pts: 150, chew:.62 },
  { em:'🍜', nm:'ラーメン',   vol:11.0, gas: 4,  pts: 200, chew:.72 },
  { em:'🍕', nm:'ピザ',       vol: 9.0, gas: 3,  pts: 165, chew:.66 },
  { em:'🍰', nm:'ケーキ',     vol: 7.0, gas: 2,  pts: 135, chew:.55 },
  { em:'🥩', nm:'ステーキ',   vol:13.0, gas: 3,  pts: 250, chew:.86 },
  { em:'🍺', nm:'ビール',     vol: 3.0, gas:15,  pts: 110, chew:.40, fizz:true },
  { em:'🥤', nm:'炭酸',       vol: 2.0, gas:12,  pts:  85, chew:.34, fizz:true },
];

const S = {
  screen:'title', stage:1, score:0, total:0, target:5000, time:70, tmax:70,
  full:0, gas:0, combo:0, comboT:0, chew:0, burpCd:0,
  digest:2.4, gasConv:.55, mul:1, growlT:6, hicT:9, best:0,
};
try{ S.best = +(localStorage.getItem('oogui_best')||0) }catch(e){}

/* ソフトボディの状態 */
const B = {
  b:0, bv:0,         // お腹の膨らみ（バネ）
  sq:0, sqv:0,       // 縦つぶれ（ゲップ時）
  chest:0, chestv:0, // 胸のふくらみ（呼吸・ゲップ）
  rip:0, ripPh:0,    // 波紋
  breath:0, br:2.4,
  burpT:0, gulpT:0,
  rub:0, rubbing:false, rubX:0, rubY:0,
  sway:0,
};

const fx = [];      // パーティクル/演出
const timers = [];  // 遅延処理

/* =====================================================================
   DOM
   ===================================================================== */
const $ = id => document.getElementById(id);
const foodsEl = $('foods');
FOODS.forEach((f,i)=>{
  const b = document.createElement('button');
  b.className = 'food' + (f.fizz?' fizz':'');
  b.innerHTML = `<span class="em">${f.em}</span><span class="nm">${f.nm}</span>
                 <span class="st">満+${f.vol} ガ+${f.gas}</span>`;
  b.onclick = ()=> eat(i);
  foodsEl.appendChild(b);
  f.el = b;
});
$('burp').onclick = ()=> doBurp();
$('btnStart').onclick = ()=> startGame(1);
$('btnRetry').onclick = ()=> startGame(1);
$('btnNext').onclick  = ()=> { $('ovClear').classList.add('hide'); nextStage(); };

addEventListener('keydown', e=>{
  if(e.code === 'Space'){ e.preventDefault(); if(S.screen==='play') doBurp(); else if(S.screen==='title') startGame(1); return; }
  const n = +e.key;
  if(n>=1 && n<=FOODS.length) eat(n-1);
});

/* お腹をなでる */
function canvasPt(e){
  const r = cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H };
}
function rubStart(e){
  Sound.init(); Sound.resume();
  if(S.screen!=='play') return;
  const p = canvasPt(e);
  if(Math.hypot(p.x-CX, p.y-bellyCY()) < 200 + B.b*140){
    B.rubbing = true; B.rubX = p.x; B.rubY = p.y; e.preventDefault();
  }
}
function rubMove(e){
  if(!B.rubbing) return;
  const p = canvasPt(e);
  const d = Math.hypot(p.x-B.rubX, p.y-B.rubY);
  if(d > 6){
    B.rub = Math.min(1, B.rub + d*.006);
    B.rip = Math.min(.55, B.rip + d*.0018);
    fx.push({ t:'ring', x:p.x, y:p.y, r:8, life:.5, age:0 });
    B.rubX = p.x; B.rubY = p.y;
  }
  e.preventDefault();
}
function rubEnd(){ B.rubbing = false; }
cv.addEventListener('pointerdown', rubStart);
cv.addEventListener('pointermove', rubMove);
addEventListener('pointerup', rubEnd);
addEventListener('pointercancel', rubEnd);

/* =====================================================================
   GAME LOGIC
   ===================================================================== */
function startGame(stage){
  Sound.init(); Sound.resume();
  S.screen='play'; S.stage=stage; S.score=0; S.total=0; S.full=0; S.gas=0;
  S.combo=0; S.comboT=0; S.chew=0; S.burpCd=0;
  S.growlT=6; S.hicT=9;
  applyStage();
  S.time = S.tmax;
  B.b=0; B.bv=0; B.sq=0; B.sqv=0; B.rip=0; B.rub=0; B.burpT=0; B.gulpT=0;
  fx.length=0; timers.length=0;
  $('ovTitle').classList.add('hide');
  $('ovOver').classList.add('hide');
  $('ovClear').classList.add('hide');
}
function applyStage(){
  const n = S.stage;
  S.target  = Math.round(5000 * Math.pow(1.45, n-1));
  S.tmax    = 70;
  S.digest  = Math.max(1.0, 2.4 - (n-1)*.22);   // 消化がだんだん遅くなる
  S.gasConv = .55 + (n-1)*.06;                  // ガスが溜まりやすくなる
  S.mul     = 1 + (n-1)*.12;                    // 一口が大きくなる
}
function nextStage(){
  S.total += S.score;
  S.stage++; applyStage();
  S.time = S.tmax; S.score = 0;
  S.full = Math.min(S.full, 45); S.gas = Math.min(S.gas, 30);
  S.growlT=6; S.hicT=9;
  S.screen='play';
}

function eat(i){
  if(S.screen!=='play' || S.chew>0) return;
  const f = FOODS[i];
  Sound.init(); Sound.resume(); Sound.chew();
  S.chew = .30 + f.chew;

  const from = f.el.getBoundingClientRect();
  const cvr  = cv.getBoundingClientRect();
  const x0 = (from.left + from.width/2 - cvr.left)/cvr.width*W;
  const y0 = (from.top  - cvr.top)/cvr.height*H;
  fx.push({ t:'fly', em:f.em, x0, y0, x1:CX, y1:-40, age:0, life:.30 });

  after(.30, ()=>{
    Sound.gulp();
    B.gulpT = .001;                       // 喉を通る演出開始
    after(.34, ()=> swallow(f));
  });
}
function swallow(f){
  if(S.screen!=='play') return;
  S.full += f.vol * S.mul;
  S.gas  += f.gas  * S.mul;
  S.combo++; S.comboT = 3.2;
  const mult = comboMul();
  addScore(Math.round(f.pts * mult));
  /* 食べ物が落ちてきた衝撃 */
  B.bv  += .16 + f.vol*.012;
  B.rip  = Math.min(1, B.rip + .28 + f.vol*.012);
  B.sqv += .8;
  if(f.fizz) Sound.blip(880, .12, .08);
}
function comboMul(){ return 1 + Math.min(S.combo, 20)*.08; }
function addScore(n){
  S.score += n;
  /* 同時に出たポップが重ならないよう段差をつける */
  const stack = fx.reduce((a,p)=> a + (p.t==='pop' && p.age < .45 ? 1 : 0), 0);
  fx.push({ t:'pop', x:CX+rnd(-60,60), y:bellyCY()-90-stack*34, s:'+'+n.toLocaleString(),
            age:0, life:1.0, col:'#ffd79a' });
}

function doBurp(){
  if(S.screen!=='play' || S.burpCd>0) return;
  S.burpCd = .45;
  Sound.init(); Sound.resume();

  if(S.gas < 7){
    /* 出せるガスがない → 小さくスカる */
    Sound.burp(.05);
    B.sqv += .5; B.rip = Math.min(1, B.rip+.1);
    fx.push({ t:'pop', x:CX+40, y:110, s:'ぷす…', age:0, life:.9, col:'#8d8189', sz:20 });
    return;
  }
  const rel   = Math.min(S.gas, 22 + S.gas*.45);
  const power = clamp(rel/58, .12, 1);
  S.gas -= rel;
  Sound.burp(power);

  B.sqv  += -3.4*power - .8;    // 縦につぶれて横に広がる
  B.chestv += 5*power;
  B.rip   = Math.min(1.2, B.rip + .55 + power*.5);
  B.burpT = .001;

  const pts = Math.round(rel * 14 * comboMul());
  addScore(pts);
  for(let i=0;i<Math.round(4+power*10);i++){
    fx.push({ t:'air', x:CX+rnd(-26,26), y:rnd(-10,40), vx:rnd(-70,70), vy:rnd(-160,-60),
              r:rnd(6,20), age:0, life:rnd(.5,1.1) });
  }
  if(rel > 44){ toast('ビッグゲップ！', '#8fd14f'); after(.28, ()=> addScore(Math.round(rel*6))); }
  else if(rel > 26) fx.push({ t:'pop', x:CX+60, y:90, s:'ゲフーッ', age:0, life:1.1, col:'#b8f078', sz:30 });
  else fx.push({ t:'pop', x:CX+56, y:100, s:'ゲプッ', age:0, life:1.0, col:'#b8f078', sz:24 });
}

function toast(txt, col){
  const el = $('toast');
  el.textContent = txt; el.style.color = col||'#ffd79a';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function after(t, fn){ timers.push({t, fn}); }

function gameOver(why){
  S.screen = 'over';
  B.rubbing = false;
  const fin = S.total + S.score;
  if(fin > S.best){ S.best = fin; try{ localStorage.setItem('oogui_best', S.best) }catch(e){} }
  $('overTtl').textContent  = why === 'full' ? 'ギブアップ…' : why === 'gas' ? '限界突破！' : 'タイムアップ';
  $('overWhy').textContent  =
      why === 'full' ? 'お腹がいっぱいで、もう一口も入らない。' :
      why === 'gas'  ? 'ガスが溜まりすぎた。もっと早くゲップを！' :
                       '時間内に目標スコアへ届かなかった。';
  $('overScore').textContent = fin.toLocaleString();
  $('overBest').textContent  = S.best.toLocaleString();
  $('ovOver').classList.remove('hide');
  Sound.blip(220,.5,.2); after(.12,()=>Sound.blip(160,.7,.2));
}
function stageClear(){
  S.screen = 'clear';
  B.rubbing = false;
  const fin = S.total + S.score;
  if(fin > S.best){ S.best = fin; try{ localStorage.setItem('oogui_best', S.best) }catch(e){} }
  $('clearTtl').textContent  = 'STAGE ' + S.stage + ' CLEAR';
  $('clearScore').textContent = fin.toLocaleString();
  $('clearMsg').innerHTML =
    `残り <b>${S.time.toFixed(1)}</b> 秒 ／ 満腹度 <b>${Math.round(S.full)}%</b><br>次は消化が遅く、ガスも溜まりやすい。`;
  $('ovClear').classList.remove('hide');
  Sound.blip(660,.15,.18); after(.13,()=>Sound.blip(880,.15,.18)); after(.27,()=>Sound.blip(1180,.4,.2));
}

/* =====================================================================
   UPDATE
   ===================================================================== */
function update(dt){
  /* タイマー */
  for(let i=timers.length-1;i>=0;i--){
    timers[i].t -= dt;
    if(timers[i].t<=0){ const f=timers[i].fn; timers.splice(i,1); f(); }
  }

  if(S.screen==='play'){
    S.time -= dt;
    S.chew   = Math.max(0, S.chew - dt);
    S.burpCd = Math.max(0, S.burpCd - dt);

    /* コンボ減衰 */
    S.comboT -= dt;
    if(S.comboT<=0 && S.combo>0){ S.combo = 0; }

    /* 消化: 満腹度 → 一部がガスへ */
    const rubBoost = B.rubbing ? 3.0 : 1;
    const dig = S.digest * rubBoost * dt * (1 + S.full/160);
    const eaten = Math.min(S.full, dig);
    S.full -= eaten;
    S.gas  += eaten * S.gasConv * (B.rubbing ? 1.7 : 1);

    S.full = Math.max(0, S.full);
    S.gas  = Math.max(0, S.gas);

    /* 腹鳴り */
    S.growlT -= dt * (1 + S.full/60);
    if(S.growlT<=0){ S.growlT = rnd(5,11); if(S.full>25){ Sound.growl(); B.rip = Math.min(1,B.rip+.18); } }
    /* しゃっくり（満腹時） */
    S.hicT -= dt;
    if(S.hicT<=0){
      S.hicT = rnd(4,9);
      if(S.full>62){ B.sqv += 1.6; B.rip = Math.min(1,B.rip+.3); Sound.blip(rnd(180,260), .08, .1); }
    }

    if(S.score >= S.target) stageClear();
    else if(S.full >= 100)  gameOver('full');
    else if(S.gas  >= 100)  gameOver('gas');
    else if(S.time <= 0)    { S.time = 0; gameOver('time'); }
  }

  /* --- ソフトボディ物理 --- */
  const target = S.full/100 * 1.0 + S.gas/100 * .26;
  const k = 42, damp = 7.6;
  B.bv += ((target - B.b)*k - B.bv*damp) * dt;
  B.b  += B.bv * dt;
  B.b   = Math.max(0, B.b);

  B.sqv += (-B.sq*54 - B.sqv*7.2) * dt;
  B.sq  += B.sqv * dt;

  B.chestv += (-B.chest*70 - B.chestv*9) * dt;
  B.chest  += B.chestv * dt;

  B.ripPh += dt * (11 + B.b*4);
  B.rip   *= Math.exp(-3.1*dt);
  B.rub   *= Math.exp(-1.4*dt);

  /* 呼吸: 満腹なほど浅く速く */
  B.br = 2.2 + S.full*.045 + S.gas*.02;
  B.breath += dt * B.br;
  B.sway   += dt * .7;

  if(B.gulpT>0){ B.gulpT += dt; if(B.gulpT>.5) B.gulpT=0; }
  if(B.burpT>0){ B.burpT += dt; if(B.burpT>1.1) B.burpT=0; }

  /* FX */
  for(let i=fx.length-1;i>=0;i--){
    const p = fx[i]; p.age += dt;
    if(p.t==='air'){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 40*dt; p.vx *= 1-1.2*dt; }
    if(p.t==='sweat'){ p.y += p.vy*dt; p.vy += 260*dt; }
    if(p.age >= p.life) fx.splice(i,1);
  }
  /* 汗（満腹・高圧時） */
  if(S.screen==='play' && (S.full>70 || S.gas>70) && Math.random() < dt*3){
    const side = Math.random()<.5 ? -1 : 1;
    fx.push({ t:'sweat', x:CX + side*(70+B.b*90+rnd(-30,30)), y:rnd(300,520),
              vy:rnd(20,60), r:rnd(2.5,5), age:0, life:rnd(.7,1.3) });
  }

  syncHUD();
}

function syncHUD(){
  $('fullN').textContent = Math.round(S.full);
  $('gasN').textContent  = Math.round(S.gas);
  $('fullBar').firstElementChild.style.width = clamp(S.full,0,100)+'%';
  $('gasBar').firstElementChild.style.width  = clamp(S.gas,0,100)+'%';
  $('fullBar').classList.toggle('danger', S.full>82);
  $('gasBar').classList.toggle('danger',  S.gas>82);
  $('stageN').textContent = S.stage;
  $('timeN').textContent  = Math.max(0,S.time).toFixed(1);
  $('scoreN').textContent = S.score.toLocaleString();
  $('targetN').textContent= S.target.toLocaleString();
  const c = $('combo'); c.classList.toggle('on', S.combo>1);
  $('comboN').textContent = comboMul().toFixed(2);
  const bp = $('burp');
  bp.classList.toggle('charged', S.gas>55);
  FOODS.forEach(f=> f.el.disabled = (S.chew>0 || S.screen!=='play'));
}

/* =====================================================================
   BODY GEOMETRY
   ===================================================================== */
function bellyCY(){ return 556 + B.b*26; }

/* 右半身の輪郭点（x はセンターからのオフセット）。soft = 揺れやすさ */
function halfOutline(){
  const b  = B.b;
  const bw = 10 + 142*b;                 // 横への張り出し
  const bd = 26*b;                       // 下への垂れ
  const br = Math.sin(B.breath)*(2.2+S.full*.02);   // 呼吸
  const ch = B.chest*10;

  return [
    { x: 47,               y:-120,           s:0    },
    { x: 45,               y:  20,           s:0    },
    { x: 60,               y:  92,           s:.02  },
    { x:112,               y: 128 - ch*.3,   s:.04  },
    { x:166,               y: 180 - ch*.4,   s:.05  }, // 肩
    { x:174,               y: 240 - ch*.2,   s:.07  }, // 三角筋
    { x:141,               y: 286 + br*.3,   s:.10  }, // 脇
    { x:136 + ch*.5,       y: 342 + br,      s:.18  }, // 胸
    { x:118 + ch*.3,       y: 396 + br*.8,   s:.28  }, // 胸下
    { x:108 + bw*.34,      y: 442,           s:.55  }, // 肋骨
    { x:106 + bw*.78,      y: 496 + bd*.3,   s:.85  }, // ウエスト
    { x:113 + bw,          y: 560 + bd,      s:1.00 }, // 最大幅
    { x:110 + bw*.93,      y: 636 + bd*1.7,  s:.95  }, // 下腹（重みで垂れる）
    { x:150 + bw*.44,      y: 706 + bd*1.2,  s:.52  }, // 腰へ
    { x:164,               y: 772,           s:.22  }, // ヒップ
    { x:152,               y: 876,           s:.08  },
    { x:146,               y:1010,           s:.02  },
  ];
}

/* 揺れ・つぶれを適用して実座標へ */
function deform(p, side){
  const cy = bellyCY();
  const wobX = B.rip * 27 * Math.sin(B.ripPh + p.y*.017);
  const wobY = B.rip * 11 * Math.cos(B.ripPh*.82 + p.y*.021);
  const sx = 1 - B.sq * .17 * p.s;
  const sy = 1 + B.sq * .13 * p.s;
  let x = p.x * sx + p.s*wobX;
  let y = cy + (p.y - cy) * sy + p.s*wobY;
  x += Math.sin(B.sway + p.y*.004) * (1.2 + B.b*2) * p.s;      // わずかな重心ゆらぎ
  return { x: CX + side*x, y };
}

function bodyPoints(){
  const h = halfOutline();
  const right = h.map(p=> deform(p, 1));
  const left  = h.map(p=> deform(p,-1)).reverse();
  return right.concat(left);
}
function bodyPath(ctx){
  const pts = bodyPoints();
  ctx.beginPath();
  smoothPath(ctx, pts);
  ctx.closePath();
}
/* 現在の腹の半幅（演出用） */
function bellyHalf(){
  const h = halfOutline()[11];
  return deform(h,1).x - CX;
}

/* =====================================================================
   TEXTURE — 肌のざらつき
   ===================================================================== */
const grain = (()=>{
  const c = document.createElement('canvas'); c.width = c.height = 220;
  const x = c.getContext('2d');
  const im = x.createImageData(220,220);
  for(let i=0;i<im.data.length;i+=4){
    const v = 118 + (Math.random()*74 - 37);
    im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255;
  }
  x.putImageData(im,0,0);
  return c;
})();

/* =====================================================================
   RENDER
   ===================================================================== */
const SKIN     = '#e6b298';
const SKIN_HI  = '#fbe0cb';
const SKIN_MID = '#d99e83';
const SKIN_SH  = '#a9694f';
const SKIN_DEEP= '#7d4634';
const CLOTH    = '#6a7488';

function draw(){
  const sc = Math.min(cv.width/W, cv.height/H);
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,cv.width,cv.height);
  g.save();
  g.translate((cv.width - W*sc)/2, (cv.height - H*sc)/2);
  g.scale(sc, sc);
  g.beginPath(); g.rect(0,0,W,H); g.clip();

  drawBackdrop();
  drawArms(false);
  drawBody();
  drawArms(true);
  drawFX();

  g.restore();
}

function drawBackdrop(){
  const gr = g.createRadialGradient(CX-60, 220, 60, CX, 520, 720);
  gr.addColorStop(0,'#2b2431'); gr.addColorStop(.55,'#191420'); gr.addColorStop(1,'#0b0910');
  g.fillStyle = gr; g.fillRect(0,0,W,H);

  /* 背後の壁の陰 */
  g.save();
  g.globalAlpha = .5; g.filter = 'blur(26px)';
  g.fillStyle = '#000';
  const hw = 190 + B.b*150;
  g.beginPath(); g.ellipse(CX+34, 560, hw, 400, 0, 0, 7); g.fill();
  g.restore();

  /* 床のライン */
  g.strokeStyle = '#000'; g.globalAlpha=.35; g.lineWidth=2;
  g.beginPath(); g.moveTo(0,880); g.lineTo(W,880); g.stroke();
  g.globalAlpha=1;

  /* 満腹・高圧時の警告ビネット */
  const heat = Math.max(S.full, S.gas)/100;
  if(heat > .6){
    const v = g.createRadialGradient(CX,470,240, CX,470,620);
    const a = (heat-.6)/.4 * (.35 + .2*Math.sin(performance.now()/160));
    v.addColorStop(0,'rgba(0,0,0,0)');
    v.addColorStop(1, `rgba(${S.gas>S.full?60:200},${S.gas>S.full?200:60},${S.gas>S.full?170:70},${clamp(a,0,.5)})`);
    g.fillStyle=v; g.fillRect(0,0,W,H);
  }
}

/* ---------- 腕 ----------
   光源は左上。左腕（screen 左）は明るく、右腕は陰に落として縁だけ拾う。 */
function armJoints(side){
  const half = bellyHalf(), t = clamp(B.b,0,1.3), br = Math.sin(B.breath)*3;
  return {
    sh: { x: CX + side*142,                y: 206 },
    el: { x: CX + side*(156 + half*.36),   y: 452 + br },
    /* お腹が育つほど手は前に回り込み、抱えるような位置になる */
    hd: { x: CX + side*(46 + half*.42),    y: 520 + t*78 + br*1.4 },
    t, half
  };
}
/* fore=true は前腕。お腹より手前にあるぶん、少し落として奥行きを出す */
function limbGrad(side, cx, fore){
  const gr = g.createLinearGradient(cx-38, 0, cx+36, 0);
  if(side < 0){
    gr.addColorStop(0,   fore?'#e3bda4':'#f6d6bd');
    gr.addColorStop(.5,  fore?'#cd9a7d':SKIN);
    gr.addColorStop(1,   fore?'#8d5440':'#a3634a');
  }else{
    gr.addColorStop(0,   fore?'#b47e64':'#c78a6e');
    gr.addColorStop(.55, fore?'#9f6a52':'#b0745a');
    gr.addColorStop(1,   fore?'#7b4734':'#8d5340');
  }
  return gr;
}
function drawArms(front){
  for(const side of [-1,1]){
    const {sh, el, hd, t} = armJoints(side);
    g.save();
    g.lineCap='round'; g.lineJoin='round';

    if(!front){
      /* --- 上腕（胴体の後ろ） --- */
      g.strokeStyle = limbGrad(side, CX + side*168);
      g.lineWidth = 52; g.beginPath(); g.moveTo(sh.x, sh.y); g.lineTo(el.x, el.y); g.stroke();

      /* 肩の丸み（胴体との継ぎ目を隠す） */
      const dg = g.createRadialGradient(sh.x - side*16, sh.y-18, 4, sh.x, sh.y, 46);
      dg.addColorStop(0, side<0 ? '#fadfc8' : '#c98d70');
      dg.addColorStop(1, side<0 ? '#d9a186' : '#96593f');
      g.fillStyle = dg;
      g.beginPath(); g.ellipse(sh.x, sh.y, 34, 44, side*.12, 0, 7); g.fill();

      /* 外側のリムライト */
      g.strokeStyle = side<0 ? 'rgba(255,236,214,.5)' : 'rgba(255,198,164,.42)';
      g.lineWidth = 2.6;
      g.beginPath();
      g.moveTo(sh.x + side*25, sh.y+6);
      g.quadraticCurveTo(el.x + side*25, el.y-44, el.x + side*20, el.y);
      g.stroke();
      g.restore();
      continue;
    }

    /* --- 前腕＋手（お腹の手前） --- */
    /* 前腕がお腹に落とす影 */
    g.save();
    g.globalCompositeOperation='multiply'; g.globalAlpha=.20; g.filter='blur(9px)';
    g.strokeStyle='#5e2b19'; g.lineWidth=42; g.lineCap='round';
    g.beginPath(); g.moveTo(el.x - side*4, el.y+12); g.lineTo(hd.x - side*4, hd.y+14); g.stroke();
    g.restore();

    g.strokeStyle = limbGrad(side, (el.x + hd.x)/2, true);
    g.lineWidth = 40; g.beginPath(); g.moveTo(el.x, el.y); g.lineTo(hd.x, hd.y); g.stroke();

    /* 肘の丸み（上腕と前腕を繋ぐ） */
    const eg = g.createRadialGradient(el.x - side*9, el.y-11, 2, el.x, el.y, 28);
    eg.addColorStop(0, side<0 ? '#dcae92' : '#ab7660');
    eg.addColorStop(1, side<0 ? '#ab7660' : '#7d4835');
    g.fillStyle = eg;
    g.beginPath(); g.ellipse(el.x, el.y, 25, 26, 0, 0, 7); g.fill();

    drawHand(hd, side, t);
    g.restore();
  }
}
function drawHand(p, side, t){
  /* お腹に落ちる接地影 */
  g.save();
  g.globalCompositeOperation='multiply'; g.globalAlpha=.22; g.filter='blur(7px)';
  g.fillStyle='#6a3524';
  g.beginPath(); g.ellipse(p.x + side*6, p.y+14, 34, 22, side*.4, 0, 7); g.fill();
  g.restore();

  g.save();
  g.translate(p.x, p.y); g.rotate(side * (.42 - t*.20));
  const gr = g.createLinearGradient(-28,-20, 24, 24);
  if(side < 0){ gr.addColorStop(0,'#eec7ad'); gr.addColorStop(.55,'#d5a084'); gr.addColorStop(1,'#a86e56'); }
  else        { gr.addColorStop(0,'#c78d72'); gr.addColorStop(.55,'#b3785f'); gr.addColorStop(1,'#8b5340'); }
  g.fillStyle = gr;
  /* 手のひら＋指 */
  g.beginPath(); g.ellipse(0,-2, 30, 23, 0, 0, 7); g.fill();
  for(let i=0;i<4;i++){
    const a = -.52 + i*.30, len = 30 - Math.abs(i-1.4)*3.4;
    const bx = -side*10, by = 2 + i*1.5;
    g.save(); g.translate(bx,by); g.rotate(-side*a);
    g.beginPath(); g.ellipse(-side*len*.5, 0, len*.55, 5.4, 0,0,7); g.fill();
    g.restore();
  }
  /* 指の間の陰 */
  g.strokeStyle='rgba(126,70,50,.30)'; g.lineWidth=1.8; g.lineCap='round';
  for(let i=0;i<3;i++){
    const a = -.37 + i*.30;
    g.save(); g.rotate(-side*a);
    g.beginPath(); g.moveTo(-side*8, 3+i*1.6); g.lineTo(-side*30, 3+i*1.6); g.stroke();
    g.restore();
  }
  g.restore();
}

/* ---------- 胴体 ---------- */
function drawBody(){
  const cy   = bellyCY();
  const half = bellyHalf();
  const fullN = clamp(S.full/100, 0, 1);

  g.save();
  bodyPath(g);
  g.save(); g.clip();

  /* --- ベースの肌 --- */
  const base = g.createLinearGradient(CX-260, 100, CX+280, 820);
  base.addColorStop(0,  '#f3cdb4');
  base.addColorStop(.34, SKIN);
  base.addColorStop(.72, SKIN_MID);
  base.addColorStop(1,  '#b87a5f');
  g.fillStyle = base; g.fillRect(0,0,W,H);

  /* --- お腹の球体シェーディング --- */
  const R = half + 150;
  const sph = g.createRadialGradient(CX-half*.36, cy-96, 16, CX-half*.06, cy-6, R);
  sph.addColorStop(0,   'rgba(255,238,219,.66)');
  sph.addColorStop(.30, 'rgba(243,196,166,.30)');
  sph.addColorStop(.62, 'rgba(170,100,72,.14)');
  sph.addColorStop(.86, 'rgba(112,54,36,.34)');
  sph.addColorStop(1,   'rgba(88,40,26,.50)');
  g.fillStyle = sph;
  g.beginPath(); g.ellipse(CX, cy, half+46, 244+B.b*76, 0, 0, 7); g.fill();

  /* --- 脇腹のアンビエントオクルージョン（ぼかした三日月） --- */
  g.save(); g.filter='blur(24px)';
  for(const s of [-1,1]){
    g.globalAlpha = s<0 ? .34 : .50;          // 右側の方が濃い（光は左上から）
    g.fillStyle = '#5d2718';
    g.beginPath(); g.ellipse(CX + s*(half+26), cy+16, 52, 200+B.b*54, 0, 0, 7); g.fill();
  }
  g.restore();

  /* --- 胸の下の陰 --- */
  g.save(); g.globalAlpha=.26; g.filter='blur(16px)'; g.fillStyle='#8a4530';
  g.beginPath(); g.ellipse(CX, 408+Math.sin(B.breath)*2, 124, 22, 0,0,7); g.fill();
  g.restore();

  /* --- ウエストのくびれの陰（お腹が育つと消える） --- */
  if(B.b < .8){
    g.save(); g.globalAlpha = (1-B.b/.8)*.22; g.filter='blur(12px)'; g.fillStyle='#7a3a25';
    for(const s of [-1,1]){
      g.beginPath(); g.ellipse(CX + s*118, 470, 26, 46, 0,0,7); g.fill();
    }
    g.restore();
  }

  /* --- 張った皮膚のツヤ --- */
  const sheen = .10 + fullN*.42 + B.b*.12;
  g.save();
  g.globalCompositeOperation = 'screen'; g.globalAlpha = clamp(sheen,0,.62);
  const sg = g.createRadialGradient(CX-half*.30, cy-110, 8, CX-half*.30, cy-110, 190+half*.5);
  sg.addColorStop(0,'rgba(255,250,242,.9)'); sg.addColorStop(.45,'rgba(255,235,220,.24)');
  sg.addColorStop(1,'rgba(255,235,220,0)');
  g.fillStyle = sg;
  g.beginPath(); g.ellipse(CX-half*.30, cy-110, 150+half*.42, 108+half*.22, -.34, 0, 7); g.fill();
  g.restore();

  /* --- 苦しさの赤み --- */
  if(fullN > .35 || S.gas > 45){
    const heat = Math.max((fullN-.35)/.65, (S.gas-45)/55, 0);
    g.save(); g.globalCompositeOperation='soft-light'; g.globalAlpha = clamp(heat*.85,0,.8);
    const rg = g.createRadialGradient(CX, cy, 40, CX, cy, half+230);
    rg.addColorStop(0,'rgba(255,90,70,.95)'); rg.addColorStop(1,'rgba(255,90,70,0)');
    g.fillStyle = rg; g.fillRect(0,0,W,H);
    g.restore();
  }

  /* --- ストレッチライン（張りすぎ） --- */
  if(fullN > .55){
    g.save();
    g.globalAlpha = clamp((fullN-.55)/.45,0,1)*.30;
    g.strokeStyle = 'rgba(255,222,205,.9)'; g.lineWidth = 2.4; g.lineCap='round';
    for(let s of [-1,1]) for(let i=0;i<4;i++){
      const y = cy - 40 + i*44;
      const x = CX + s*(half*.60 + i*6);
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + s*20, y+16, x + s*10, y+42);
      g.stroke();
    }
    g.restore();
  }

  /* --- おへそ（膨らむほど横に伸びて浅くなる） --- */
  drawNavel(CX, cy + 52 + B.b*30, 15 + B.b*26, 21 - B.b*9);

  /* --- なでている場所のハイライト --- */
  if(B.rub > .02){
    g.save(); g.globalCompositeOperation='screen'; g.globalAlpha = clamp(B.rub*.5,0,.4);
    const rg2 = g.createRadialGradient(B.rubX, B.rubY, 4, B.rubX, B.rubY, 120);
    rg2.addColorStop(0,'rgba(255,214,190,.8)'); rg2.addColorStop(1,'rgba(255,214,190,0)');
    g.fillStyle = rg2; g.beginPath(); g.arc(B.rubX,B.rubY,120,0,7); g.fill();
    g.restore();
  }

  /* --- 首（円柱として陰をつけ、上には頭の落とす影） --- */
  drawNeck();

  /* --- みぞおち下の折れ（張ってくると出る） --- */
  if(B.b > .32){
    g.save();
    g.globalAlpha = clamp((B.b-.32)/.7, 0, 1)*.24; g.filter='blur(11px)';
    g.fillStyle = '#7c3a24';
    g.beginPath(); g.ellipse(CX-6, cy - 148 - B.b*18, half*.56, 15, .04, 0, 7); g.fill();
    g.restore();
  }

  /* --- ボトムス --- */
  drawShorts();

  /* --- せり出したお腹がウエストに落とす影 --- */
  g.save();
  g.globalCompositeOperation='multiply';
  g.globalAlpha = clamp(.22 + B.b*.42, 0, .68); g.filter='blur(20px)';
  g.fillStyle = '#4d1d10';
  g.beginPath(); g.ellipse(CX, cy + 168 + B.b*74, half*1.02, 54 + B.b*30, 0, 0, 7); g.fill();
  g.restore();

  /* --- 服 --- */
  drawTop();

  /* --- 全体のざらつき（肌も布も同じ粒で馴染ませる） --- */
  g.save();
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = .12;
  g.fillStyle = g.createPattern(grain,'repeat'); g.fillRect(0,0,W,H);
  g.restore();

  /* --- 飲み込みの喉の膨らみ --- */
  if(B.gulpT > 0){
    const t = clamp(B.gulpT/.5, 0, 1);
    const y = lerp(-10, 250, ease(t));
    g.save(); g.globalAlpha = (1-t)*.85;
    const gg2 = g.createRadialGradient(CX-6, y-6, 2, CX, y, 26);
    gg2.addColorStop(0,'rgba(255,235,215,.95)'); gg2.addColorStop(1,'rgba(190,120,95,0)');
    g.fillStyle = gg2; g.beginPath(); g.ellipse(CX, y, 22, 15, 0,0,7); g.fill();
    g.restore();
  }

  g.restore();   // clip 解除

  /* --- 輪郭のリムライト --- */
  bodyPath(g);
  g.save();
  g.strokeStyle = 'rgba(255,206,175,.42)'; g.lineWidth = 2.4; g.stroke();
  g.strokeStyle = 'rgba(56,20,14,.5)';     g.lineWidth = 1.1; g.stroke();
  g.restore();
  g.restore();
}

/* ---------- 首 ---------- */
function drawNeck(){
  g.save();
  /* 円柱の陰影 */
  const ng = g.createLinearGradient(CX-48, 0, CX+48, 0);
  ng.addColorStop(0,   'rgba(255,224,200,.42)');
  ng.addColorStop(.34, 'rgba(255,224,200,0)');
  ng.addColorStop(.72, 'rgba(120,58,38,.26)');
  ng.addColorStop(1,   'rgba(96,42,26,.50)');
  g.fillStyle = ng; g.fillRect(CX-52, -140, 104, 300);

  /* あご下の影（頭はフレーム外） */
  const jg = g.createLinearGradient(0, -30, 0, 96);
  jg.addColorStop(0,'rgba(58,22,12,.72)'); jg.addColorStop(1,'rgba(58,22,12,0)');
  g.fillStyle = jg; g.fillRect(CX-70, -40, 140, 140);

  /* 胸鎖乳突筋のあたり */
  g.strokeStyle='rgba(150,86,62,.20)'; g.lineWidth=6; g.lineCap='round';
  for(const s of [-1,1]){
    g.beginPath(); g.moveTo(CX + s*30, -20);
    g.quadraticCurveTo(CX + s*22, 60, CX + s*8, 128); g.stroke();
  }
  /* 喉のくぼみ */
  g.globalAlpha=.35; g.filter='blur(6px)'; g.fillStyle='#8a4a32';
  g.beginPath(); g.ellipse(CX, 138, 16, 9, 0,0,7); g.fill();
  g.restore();
}

function drawNavel(x, y, w, h){
  g.save();
  g.globalAlpha = clamp(1 - B.b*.35, .35, 1);
  const d = g.createRadialGradient(x, y-2, 1, x, y, w);
  d.addColorStop(0,'rgba(96,44,30,.85)'); d.addColorStop(.6,'rgba(140,76,55,.45)'); d.addColorStop(1,'rgba(150,90,66,0)');
  g.fillStyle = d;
  g.beginPath(); g.ellipse(x, y, w, h, 0, 0, 7); g.fill();
  /* 上の縁の影 / 下の縁のハイライト */
  g.strokeStyle='rgba(84,38,26,.6)'; g.lineWidth=2.6;
  g.beginPath(); g.ellipse(x, y-2, w*.62, h*.55, 0, Math.PI*.9, Math.PI*2.1); g.stroke();
  g.strokeStyle='rgba(255,226,206,.42)'; g.lineWidth=2;
  g.beginPath(); g.ellipse(x, y+3, w*.66, h*.5, 0, .1, Math.PI*.95); g.stroke();
  g.restore();
}

/* ---------- ボトムス（お腹に押されてウエストが下がる） ---------- */
function drawShorts(){
  const half = bellyHalf(), b = clamp(B.b,0,1.3);
  const bandTop = 738 + b*30;
  const push    = 14 + 46*b;                 // 中央ほど下へ押し下げられる
  const bandAt  = x=>{
    const t = clamp(Math.abs(x-CX)/188, 0, 1);
    return bandTop + push*(1 - t*t);
  };
  g.save();
  g.beginPath();
  g.moveTo(-40, H+60); g.lineTo(W+40, H+60);
  for(let x=W+40; x>=-40; x-=12) g.lineTo(x, bandAt(x));
  g.closePath();
  g.save(); g.clip();

  const dg = g.createLinearGradient(CX-220, 700, CX+240, 980);
  dg.addColorStop(0,'#59688a'); dg.addColorStop(.45,'#414d69'); dg.addColorStop(1,'#242c3e');
  g.fillStyle = dg; g.fillRect(0, 700, W, 300);

  /* 股の切れ込みと脚の陰 */
  g.save(); g.filter='blur(10px)'; g.globalAlpha=.55; g.fillStyle='#161c2a';
  g.beginPath(); g.ellipse(CX, H+30, 44, 150, 0,0,7); g.fill();
  g.restore();
  /* 太もも側の折りジワ */
  g.strokeStyle='rgba(15,20,32,.35)'; g.lineWidth=3; g.lineCap='round';
  for(const s of [-1,1]){
    g.beginPath();
    g.moveTo(CX + s*40, bandAt(CX+s*40)+52);
    g.quadraticCurveTo(CX + s*112, bandAt(CX+s*112)+96, CX + s*158, bandAt(CX+s*158)+170);
    g.stroke();
  }
  /* ステッチ */
  g.setLineDash([7,7]); g.strokeStyle='rgba(214,190,140,.35)'; g.lineWidth=1.6;
  g.beginPath();
  for(let x=CX-190; x<=CX+190; x+=8){ const y=bandAt(x)+13; x===CX-190?g.moveTo(x,y):g.lineTo(x,y); }
  g.stroke(); g.setLineDash([]);
  g.restore();  // バンドのクリップ解除

  /* ウエストバンドが食い込む陰 */
  g.save();
  g.globalCompositeOperation='multiply'; g.globalAlpha=.32 + b*.22; g.filter='blur(7px)';
  g.strokeStyle='#5b2416'; g.lineWidth = 16;
  g.beginPath();
  for(let x=CX-200; x<=CX+200; x+=10){ const y=bandAt(x)-9; x===CX-200?g.moveTo(x,y):g.lineTo(x,y); }
  g.stroke();
  g.restore();
  /* バンド上端のハイライト */
  g.strokeStyle='rgba(190,206,240,.32)'; g.lineWidth=2.4;
  g.beginPath();
  for(let x=CX-200; x<=CX+200; x+=10){ const y=bandAt(x)+1; x===CX-200?g.moveTo(x,y):g.lineTo(x,y); }
  g.stroke();
  g.restore();
}

/* ---------- トップス（お腹が育つと裾がめくれ上がる） ---------- */
function drawTop(){
  const half = bellyHalf();
  const lift = 22 + 104*clamp(B.b,0,1.15);
  const hemBase = 512;
  const hemAt = x=>{
    const t = clamp(Math.abs(x-CX)/(half+56), 0, 1);
    return Math.max(376, hemBase - lift*(1 - t*t)) + Math.sin(B.breath + x*.012)*1.6;
  };
  /* 襟ぐり: |dx| < scoopW の内側だけ布が下がらず肌が見える */
  const scoopW = 116, scoopTop = 118, scoopD = 122;
  const neckAt = x=>{
    const d = Math.abs(x-CX);
    if(d >= scoopW) return -260;
    return scoopTop + scoopD*Math.sqrt(1 - (d/scoopW)*(d/scoopW));
  };

  /* --- 鎖骨（布より先に描いて、外側は布で隠す） --- */
  g.save();
  g.strokeStyle='rgba(146,84,62,.42)'; g.lineWidth=3.4; g.lineCap='round';
  for(const s of [-1,1]){
    g.beginPath(); g.moveTo(CX + s*15, 176);
    g.quadraticCurveTo(CX + s*66, 166, CX + s*112, 190); g.stroke();
  }
  g.strokeStyle='rgba(255,228,206,.30)'; g.lineWidth=2.2;
  for(const s of [-1,1]){
    g.beginPath(); g.moveTo(CX + s*15, 171);
    g.quadraticCurveTo(CX + s*66, 161, CX + s*110, 185); g.stroke();
  }
  /* 首の付け根の陰 */
  g.globalAlpha=.30; g.filter='blur(9px)'; g.fillStyle='#8f4a33';
  g.beginPath(); g.ellipse(CX, 150, 52, 22, 0,0,7); g.fill();
  g.restore();

  /* --- 布 --- */
  g.save();
  g.beginPath();
  for(let x=-40; x<=W+40; x+=8){ const y=neckAt(x); x===-40?g.moveTo(x,y):g.lineTo(x,y); }
  for(let x=W+40; x>=-40; x-=8) g.lineTo(x, hemAt(x));
  g.closePath();
  g.save(); g.clip();

  const cg = g.createLinearGradient(CX-230, 140, CX+250, 560);
  cg.addColorStop(0,'#97a3b9'); cg.addColorStop(.38, CLOTH); cg.addColorStop(1,'#333a4b');
  g.fillStyle = cg; g.fillRect(0,0,W,H);

  /* 胸のふくらみに沿うドレープ */
  g.save(); g.globalCompositeOperation='screen'; g.globalAlpha=.22;
  for(const s of [-1,1]){
    const bg = g.createRadialGradient(CX+s*58-16, 322, 6, CX+s*58, 330, 92);
    bg.addColorStop(0,'rgba(226,236,255,.85)'); bg.addColorStop(1,'rgba(226,236,255,0)');
    g.fillStyle=bg; g.beginPath(); g.arc(CX+s*58, 330, 92, 0, 7); g.fill();
  }
  g.restore();
  g.save(); g.globalAlpha=.30; g.filter='blur(12px)'; g.fillStyle='#222a3a';
  g.beginPath(); g.ellipse(CX, 400+Math.sin(B.breath)*2, 118, 20, 0,0,7); g.fill();
  g.restore();

  /* 布のシワ（少なめ・不規則に） */
  g.strokeStyle = 'rgba(20,26,38,.26)'; g.lineWidth = 2.6; g.lineCap='round';
  const wr = [[-96,404,26],[84,428,-20],[-58,462,18],[64,470,-14]];
  for(const [wx,wy,c] of wr){
    g.beginPath();
    g.moveTo(CX+wx, wy);
    g.quadraticCurveTo(CX+wx+c*2, wy+18, CX+wx*.15, wy+34);
    g.stroke();
  }
  /* お腹に押し上げられて張る部分 */
  g.save(); g.globalCompositeOperation='screen'; g.globalAlpha = clamp(B.b*.45,0,.4);
  const st = g.createRadialGradient(CX, hemAt(CX)+34, 8, CX, hemAt(CX)+34, 230);
  st.addColorStop(0,'rgba(220,232,255,.6)'); st.addColorStop(1,'rgba(220,232,255,0)');
  g.fillStyle=st; g.fillRect(0,0,W,H); g.restore();

  /* 裾ぎわの陰 */
  g.save(); g.globalAlpha=.42; g.filter='blur(9px)';
  g.strokeStyle='#0d1119'; g.lineWidth=26;
  g.beginPath();
  for(let x=CX-half-70; x<=CX+half+70; x+=10){ const y=hemAt(x)-14; x===CX-half-70?g.moveTo(x,y):g.lineTo(x,y); }
  g.stroke();
  g.restore();
  g.restore();  // 布クリップ解除

  /* 襟ぐりのふち */
  g.save();
  g.strokeStyle='rgba(24,30,44,.55)'; g.lineWidth=4.5; g.lineJoin='round';
  g.beginPath();
  for(let x=CX-scoopW; x<=CX+scoopW; x+=6){ const y=neckAt(x); x===CX-scoopW?g.moveTo(x,y):g.lineTo(x,y); }
  g.stroke();
  g.strokeStyle='rgba(190,202,224,.30)'; g.lineWidth=1.8;
  g.beginPath();
  for(let x=CX-scoopW; x<=CX+scoopW; x+=6){ const y=neckAt(x)+4; x===CX-scoopW?g.moveTo(x,y):g.lineTo(x,y); }
  g.stroke();
  g.restore();

  /* 裾のライン */
  g.save();
  g.strokeStyle = 'rgba(232,240,255,.34)'; g.lineWidth = 3.2; g.lineCap='round';
  g.beginPath();
  for(let x=CX-half-70; x<=CX+half+70; x+=10){ const y=hemAt(x); x===CX-half-70?g.moveTo(x,y):g.lineTo(x,y); }
  g.stroke();
  g.restore();
}

/* ---------- FX ---------- */
function drawFX(){
  for(const p of fx){
    const t = p.age/p.life;
    if(p.t==='fly'){
      const e = ease(clamp(t,0,1));
      const x = lerp(p.x0,p.x1,e);
      const y = lerp(p.y0,p.y1,e) - Math.sin(e*Math.PI)*130;
      g.save(); g.globalAlpha = 1-t*t;
      g.font='44px serif'; g.textAlign='center';
      g.translate(x,y); g.rotate(e*3.4); g.fillText(p.em,0,0); g.restore();
    }
    else if(p.t==='pop'){
      g.save(); g.globalAlpha = clamp(1-t,0,1);
      g.font = `800 ${(p.sz||26)}px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif`;
      g.textAlign='center'; g.fillStyle = p.col;
      g.shadowColor='#000'; g.shadowBlur=10;
      g.fillText(p.s, p.x, p.y - t*44); g.restore();
    }
    else if(p.t==='air'){
      g.save(); g.globalAlpha = clamp(1-t,0,1)*.5;
      g.strokeStyle='rgba(200,255,235,.9)'; g.lineWidth=2.2;
      g.beginPath(); g.arc(p.x, p.y, p.r + t*30, 0, 7); g.stroke(); g.restore();
    }
    else if(p.t==='ring'){
      g.save(); g.globalAlpha = clamp(1-t,0,1)*.35;
      g.strokeStyle='rgba(255,230,215,.9)'; g.lineWidth=2;
      g.beginPath(); g.arc(p.x,p.y, p.r + t*46, 0, 7); g.stroke(); g.restore();
    }
    else if(p.t==='sweat'){
      g.save(); g.globalAlpha = clamp(1-t,0,1)*.8;
      const sg2 = g.createRadialGradient(p.x-1,p.y-2,.5, p.x,p.y,p.r*2);
      sg2.addColorStop(0,'rgba(255,255,255,.95)'); sg2.addColorStop(1,'rgba(210,235,255,.15)');
      g.fillStyle=sg2;
      g.beginPath(); g.ellipse(p.x,p.y,p.r,p.r*1.5,0,0,7); g.fill(); g.restore();
    }
  }
  /* ゲップ時の衝撃波 */
  if(B.burpT>0){
    const t = clamp(B.burpT/1.1,0,1);
    g.save(); g.globalAlpha = (1-t)*.35;
    g.strokeStyle='rgba(180,255,220,.8)'; g.lineWidth=3;
    g.beginPath(); g.arc(CX, 40, 40 + t*430, 0, 7); g.stroke(); g.restore();
  }
}

/* =====================================================================
   LOOP
   ===================================================================== */
let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, .033);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
resize();
syncHUD();
requestAnimationFrame(frame);
</script>
</body>
</html>
