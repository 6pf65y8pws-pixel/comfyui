<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>体型シート（開発用）</title>
    <style>
      body {
        margin: 0;
        background: #17150f;
        color: #a89880;
        font-family: system-ui, sans-serif;
      }
      .sheet {
        padding: 24px;
      }
      h1 {
        font-size: 14px;
        letter-spacing: 0.2em;
        font-weight: 500;
        margin: 0 0 20px;
      }
      .row {
        display: flex;
        gap: 18px;
        align-items: flex-end;
        margin-bottom: 32px;
      }
      figure {
        margin: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      figcaption {
        font-size: 11px;
        line-height: 1.6;
        text-align: center;
        margin-top: 10px;
      }
      figcaption b {
        display: block;
        color: #c4bfa8;
        font-size: 13px;
      }
      figcaption span {
        color: #6b5d4a;
      }
      /* 頭身グリッド：1マス＝1頭身（56px）。関節位置の確認用 */
      .grid {
        flex: 1;
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(196, 70, 42, 0.55) 0 1px,
          transparent 1px 56px
        );
        background-position: 0 0;
        background-size: 100% 420px;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/figures.tsx"></script>
  </body>
</html>
